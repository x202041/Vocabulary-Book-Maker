<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多言語対応 単語帳作成・検索アプリ</title>
    <style>
        /* --- テーマ用のCSS変数（ライトモード：デフォルト） --- */
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --container-bg: #fafafa;
            --border-color: #ccc;
            --box-bg: #f8f9fa;
            --card-bg: #fafafa;
            --card-border: #e0e0e0;
            --meta-color: #666;
            --example-color: #444;
            --btn-bg: #f0f0f0;
            --btn-hover: #e0e0e0;
            --input-bg: #ffffff;
            --input-text: #333333;
        }

        /* ダークモード時の変数上書き */
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --container-bg: #2d2d2d;
            --border-color: #444;
            --box-bg: #242424;
            --card-bg: #2a2a2a;
            --card-border: #444;
            --meta-color: #aaa;
            --example-color: #ccc;
            --btn-bg: #333333;
            --btn-hover: #444444;
            --input-bg: #222222;
            --input-text: #e0e0e0;
        }

        body {
            font-family: sans-serif;
            max-width: 850px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            transition: background-color 0.3s, color 0.3s;
        }
        h1, h2 { border-bottom: 2px solid var(--border-color); padding-bottom: 5px; }
        
        /* フォーム関連 */
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input[type="text"], textarea, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            font-size: 14px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--input-text);
            border-radius: 4px;
        }
        textarea { height: 60px; resize: vertical; }
        .required { color: #ff6b6b; margin-left: 4px; }
        
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--btn-bg);
            color: var(--text-color);
        }
        button:hover { background-color: var(--btn-hover); }
        .btn-submit {
            background-color: #28a745;
            color: white;
            border: none;
            font-weight: bold;
            width: 100%;
            padding: 10px;
        }
        .btn-submit:hover { background-color: #218838; }

        /* 削除ボタン */
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
        }
        .btn-delete:hover { background-color: #c82333; }

        /* トップコントロールバー（テーマ切り替え用） */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
            align-items: center;
            gap: 8px;
        }

        /* 検索・コントロールエリア */
        .control-box {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .search-row, .json-row, .sort-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        .search-row input { flex: 1; }

        /* カード表示 */
        .word-card {
            border: 1px solid var(--card-border);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            background: var(--card-bg);
        }
        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .word-head { font-size: 1.1em; font-weight: bold; color: #4dabf7; }
        .score-badge { color: #ff6b6b; font-weight: bold; margin-left: 8px; font-size: 0.9em; }
        
        /* 改行を反映するためのスタイル (white-space: pre-wrap;) */
        .word-meta { color: var(--meta-color); font-size: 0.9em; margin-top: 4px; white-space: pre-wrap; }
        .word-example { font-style: italic; color: var(--example-color); margin-top: 4px; font-size: 0.9em; white-space: pre-wrap; }

        /* ページネーション */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }
    </style>
</head>
<body data-theme="light">

    <!-- テーマ切り替えバー -->
    <div class="top-bar">
        <label for="themeSelect" style="font-size: 0.9em; margin:0;">テーマ:</label>
        <select id="themeSelect" style="width: auto; padding: 4px 8px;">
            <option value="light">ライトモード</option>
            <option value="dark">ダークモード</option>
        </select>
    </div>

    <h1>多言語対応 単語帳作成・検索ツール</h1>

    <!-- 1. 単語登録フォーム -->
    <section>
        <h2>新しい単語を登録</h2>
        <form id="wordForm">
            <div class="form-group">
                <label>単語 <span class="required">*必須</span></label>
                <input type="text" id="wordInput" required placeholder="例: apple / Bonjour / こんにちは">
            </div>
            <div class="form-group">
                <label>和訳・意味 <span class="required">*必須</span></label>
                <input type="text" id="jaInput" required placeholder="例: りんご / こんにちは">
            </div>
            <div class="form-group">
                <label>備考 (任意・改行反映)</label>
                <textarea id="noteInput" placeholder="例: フランス語の挨拶&#10;関連語: fruit"></textarea>
            </div>
            <div class="form-group">
                <label>例文 (任意・改行反映)</label>
                <textarea id="exampleInput" placeholder="例: Bonjour,&#10;comment ça va?"></textarea>
            </div>
            <div class="form-group">
                <label>例文の和訳 (任意・改行反映)</label>
                <textarea id="exampleJaInput" placeholder="例: こんにちは、&#10;お元気ですか？"></textarea>
            </div>
            <button type="submit" class="btn-submit">単語帳に追加</button>
        </form>
    </section>

    <!-- 2. JSON操作・検索コントロール -->
    <section class="control-box">
        <div class="json-row">
            <button id="downloadBtn">JSONとしてダウンロード</button>
            <button id="uploadTriggerBtn">JSONファイルをアップロード</button>
            <input type="file" id="uploadInput" accept=".json" style="display: none;">
        </div>

        <hr style="border:0; border-top:1px solid var(--border-color); margin: 15px 0;">

        <div class="search-row">
            <input type="text" id="searchInput" placeholder="単語または和訳で検索 (一致度順に最大20件)">
            <button id="searchBtn">検索</button>
            <button id="clearSearchBtn">クリア</button>
        </div>
    </section>

    <!-- 3. 単語一覧表示エリア -->
    <section>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="listTitle" style="border: none; margin: 0;">単語一覧</h2>
            <div class="sort-row" style="margin: 0;">
                <label for="sortOrder" style="margin: 0; font-weight: normal; font-size: 0.9em;">表示順:</label>
                <select id="sortOrder" style="width: auto;">
                    <option value="desc">新しい順 (デフォルト)</option>
                    <option value="asc">古い順</option>
                </select>
            </div>
        </div>

        <div class="pagination" id="paginationArea">
            <button id="prevBtn">前へ</button>
            <span id="pageInfo">1 / 1 ページ (全 0 件)</span>
            <button id="nextBtn">次へ</button>
        </div>

        <div id="wordList"></div>
    </section>

    <script>
        // キー定義
        const STORAGE_KEY = 'my_vocab_app_data';
        const THEME_KEY = 'my_vocab_app_theme';

        // データ保持用配列と状態管理
        let dictionary = [];
        let autoIncrementId = 1;
        let currentPage = 1;
        const ITEMS_PER_PAGE = 100;
        let searchResults = null;

        // --- テーマの適用・初期化 ---
        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeSelect').value = savedTheme;
        }

        document.getElementById('themeSelect').addEventListener('change', (e) => {
            const selectedTheme = e.target.value;
            document.body.setAttribute('data-theme', selectedTheme);
            localStorage.setItem(THEME_KEY, selectedTheme);
        });

        // --- LocalStorage からデータを読み込む関数 ---
        function loadData() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    if (Array.isArray(parsed)) {
                        dictionary = parsed.map(item => ({
                            ...item,
                            word: item.word || item.en || ''
                        }));
                        const maxOrder = dictionary.reduce((max, item) => (item.order > max ? item.order : max), 0);
                        autoIncrementId = maxOrder + 1;
                    }
                } catch (e) {
                    console.error('LocalStorageのデータ読み込みに失敗しました:', e);
                }
            }
        }

        // --- LocalStorage にデータを保存する関数 ---
        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dictionary));
        }

        // --- 部分文字列生成関数 (N-gram処理) ---
        function getSubstrings(str, length) {
            const substrings = [];
            for (let i = 0; i <= str.length - length; i++) {
                substrings.push(str.slice(i, i + length));
            }
            return substrings;
        }

        // 1. 単語登録処理
        document.getElementById('wordForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const word = document.getElementById('wordInput').value.trim();
            const ja = document.getElementById('jaInput').value.trim();
            const note = document.getElementById('noteInput').value.trim();
            const example = document.getElementById('exampleInput').value.trim();
            const exampleJa = document.getElementById('exampleJaInput').value.trim();

            if (!word || !ja) {
                alert('単語と和訳は必須項目です。');
                return;
            }

            dictionary.push({
                order: autoIncrementId++,
                word: word,
                ja: ja,
                note: note,
                example: example,
                exampleJa: exampleJa
            });

            saveData();
            document.getElementById('wordForm').reset();
            clearSearch();
        });

        // 2. あいまい検索処理
        document.getElementById('searchBtn').addEventListener('click', runSearch);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') runSearch();
        });

        function runSearch() {
            const rawQuery = document.getElementById('searchInput').value.trim();
            if (!rawQuery) {
                clearSearch();
                return;
            }

            const query = rawQuery.toLowerCase();

            const scoredList = dictionary
                .map(item => {
                    let score = 0;
                    const targetWord = (item.word || '').toLowerCase();
                    const targetJa = item.ja || '';

                    if (targetWord === query || targetJa === query) {
                        score += 100;
                    } else if (targetWord.startsWith(query) || targetJa.startsWith(query)) {
                        score += 50;
                    }

                    for (let subLength = 1; subLength <= query.length; subLength++) {
                        const chunks = getSubstrings(query, subLength);
                        let matchCount = 0;

                        chunks.forEach(chunk => {
                            if (targetWord.includes(chunk)) matchCount++;
                            if (targetJa.includes(chunk)) matchCount++;
                        });

                        score += matchCount * (subLength * 2);
                    }

                    return { ...item, score };
                })
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score);

            searchResults = scoredList.slice(0, 20);
            render();
        }

        document.getElementById('clearSearchBtn').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            clearSearch();
        });

        function clearSearch() {
            searchResults = null;
            currentPage = 1;
            render();
        }

        // 3. 表示順切り替え
        document.getElementById('sortOrder').addEventListener('change', () => {
            render();
        });

        // 4. 削除処理
        function deleteWord(order) {
            const isConfirmed = confirm('本当に削除しますか？');
            if (isConfirmed) {
                dictionary = dictionary.filter(item => item.order !== order);
                
                if (searchResults !== null) {
                    searchResults = searchResults.filter(item => item.order !== order);
                }

                saveData();
                render();
            }
        }

        // 5. 画面描画処理
        function render() {
            const listContainer = document.getElementById('wordList');
            const paginationArea = document.getElementById('paginationArea');
            const listTitle = document.getElementById('listTitle');
            const sortOrder = document.getElementById('sortOrder').value;

            listContainer.innerHTML = '';

            if (searchResults !== null) {
                listTitle.textContent = `検索結果 (${searchResults.length} 件 / 最大20件)`;
                paginationArea.style.display = 'none';

                if (searchResults.length === 0) {
                    listContainer.innerHTML = '<p style="color:#888;">一致する単語が見つかりませんでした。</p>';
                    return;
                }

                searchResults.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'word-card';
                    card.innerHTML = `
                        <div class="word-header">
                            <div class="word-head">
                                #${item.order} : ${item.word} (${item.ja})
                                <span class="score-badge">(一致度: ${item.score}pt)</span>
                            </div>
                            <button class="btn-delete" onclick="deleteWord(${item.order})">削除</button>
                        </div>
                        ${item.note ? `<div class="word-meta">備考: ${item.note}</div>` : ''}
                        ${item.example ? `<div class="word-example">例文: ${item.example}</div>` : ''}
                        ${item.exampleJa ? `<div class="word-example">和訳: ${item.exampleJa}</div>` : ''}
                    `;
                    listContainer.appendChild(card);
                });
                return;
            }

            listTitle.textContent = '単語一覧';
            paginationArea.style.display = 'flex';

            const displayData = [...dictionary].sort((a, b) => {
                return sortOrder === 'desc' ? b.order - a.order : a.order - b.order;
            });

            const totalItems = displayData.length;
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE) || 1;

            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageData = displayData.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            if (pageData.length === 0) {
                listContainer.innerHTML = '<p style="color:#888;">登録されている単語はありません。</p>';
            } else {
                pageData.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'word-card';
                    card.innerHTML = `
                        <div class="word-header">
                            <div class="word-head">#${item.order} : ${item.word} (${item.ja})</div>
                            <button class="btn-delete" onclick="deleteWord(${item.order})">削除</button>
                        </div>
                        ${item.note ? `<div class="word-meta">備考: ${item.note}</div>` : ''}
                        ${item.example ? `<div class="word-example">例文: ${item.example}</div>` : ''}
                        ${item.exampleJa ? `<div class="word-example">和訳: ${item.exampleJa}</div>` : ''}
                    `;
                    listContainer.appendChild(card);
                });
            }

            document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages} ページ (全 ${totalItems} 件)`;
            document.getElementById('prevBtn').disabled = (currentPage === 1);
            document.getElementById('nextBtn').disabled = (currentPage === totalPages);
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                render();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            const totalPages = Math.ceil(dictionary.length / ITEMS_PER_PAGE);
            if (currentPage < totalPages) {
                currentPage++;
                render();
            }
        });

        // 6. JSONダウンロード
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (dictionary.length === 0) {
                alert('ダウンロードするデータがありません。');
                return;
            }

            const jsonStr = JSON.stringify(dictionary, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'dictionary_data.json';
            a.click();
            
            URL.revokeObjectURL(url);
        });

        // 7. JSONアップロード
        const uploadInput = document.getElementById('uploadInput');
        document.getElementById('uploadTriggerBtn').addEventListener('click', () => {
            uploadInput.click();
        });

        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (!Array.isArray(importedData)) throw new Error('配列形式ではありません。');

                    dictionary = importedData.map(item => ({
                        ...item,
                        word: item.word || item.en || ''
                    }));
                    
                    const maxOrder = dictionary.reduce((max, item) => (item.order > max ? item.order : max), 0);
                    autoIncrementId = maxOrder + 1;

                    saveData();
                    clearSearch();
                    alert('JSONファイルの読み込みと自動保存が完了しました！');
                } catch (err) {
                    alert('ファイルの読み込みに失敗しました: ' + err.message);
                }
            };
            reader.readAsText(file);
            uploadInput.value = '';
        });

        // --- 初期化処理 ---
        initTheme(); // テーマの読み込み
        loadData();  // データの読み込み
        render();    // 描画
    </script>
</body>
</html>
